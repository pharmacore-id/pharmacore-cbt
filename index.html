<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHARMACORE CBT</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h2>PHARMACORE CBT</h2>
    <input id="nama" placeholder="Nama">
    <input id="token" placeholder="Token">
    <button onclick="login()">Mulai Ujian</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="topbar">
    <div>CBT</div>
    <div>
      <span id="answeredCount">0</span>/<span id="totalCount">0</span>
      <span id="timer">60:00</span>
    </div>
  </div>

  <div class="container">

    <div class="main">
      <h3 id="questionLabel"></h3>
      <div id="q"></div>
      <div id="opt"></div>

      <button onclick="toggleRagu()">🚩 Ragu</button>
      <button onclick="prev()">Prev</button>
      <button onclick="next()">Next</button>
    </div>

    <div class="side">
      <div id="nav" class="grid"></div>
      <button onclick="submitExam()">Submit</button>
      <button onclick="toggleDarkMode()">Dark Mode</button>
      <button onclick="toggleCalculator()">Calculator</button>
    </div>

  </div>
</div>

<!-- RESULT -->
<div id="result" style="display:none;">
  <h2>Hasil</h2>
  <div id="score"></div>
  <div id="board"></div>
</div>

<!-- CALCULATOR -->
<div id="calculatorModal" style="display:none;">
  <div class="calc">

    <input id="calcDisplay" readonly>

    <div>
      <button onclick="calc('sin(')">sin</button>
      <button onclick="calc('cos(')">cos</button>
      <button onclick="calc('tan(')">tan</button>
      <button onclick="calc('sqrt(')">√</button>

      <button onclick="calc('7')">7</button>
      <button onclick="calc('8')">8</button>
      <button onclick="calc('9')">9</button>
      <button onclick="calc('/')">/</button>

      <button onclick="calc('4')">4</button>
      <button onclick="calc('5')">5</button>
      <button onclick="calc('6')">6</button>
      <button onclick="calc('*')">*</button>

      <button onclick="calc('1')">1</button>
      <button onclick="calc('2')">2</button>
      <button onclick="calc('3')">3</button>
      <button onclick="calc('-')">-</button>

      <button onclick="calc('0')">0</button>
      <button onclick="calc('.')">.</button>
      <button onclick="calculateResult()">=</button>
      <button onclick="calc('+')">+</button>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
