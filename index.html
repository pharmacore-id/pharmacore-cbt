<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHARMACORE CBT</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login">

  <div class="login-card">

    <h2>PHARMACORE CBT</h2>

    <input id="nama" placeholder="Nama Peserta">
    <input id="token" placeholder="Token Ujian">

    <button class="start-btn" onclick="login()">
      Mulai Ujian
    </button>

  </div>

</div>

<!-- APP -->
<div id="app" style="display:none;">

  <!-- TOPBAR -->
  <div class="topbar">

    <div>PHARMACORE CBT</div>

    <div>
      <span id="answeredCount">0</span> / <span id="totalCount">0</span>
      <span id="timer">60:00</span>
    </div>

  </div>

  <div class="wrapper">

    <!-- MAIN -->
    <div class="card">

      <div id="questionLabel">Soal</div>

      <div class="progress">
        <div id="progressFill"></div>
      </div>

      <div id="q"></div>
      <div id="opt"></div>

      <button onclick="toggleRagu()" class="ragu-btn">Ragu</button>

      <div style="margin-top:10px;">
        <button onclick="prevQuestion()">Prev</button>
        <button onclick="nextQuestion()">Next</button>
      </div>

    </div>

    <!-- SIDE -->
    <div class="side">

      <div id="nav" class="grid"></div>

      <div>
        <p>Terjawab: <span id="answeredSummary">0</span></p>
        <p>Belum: <span id="unansweredSummary">0</span></p>
      </div>

      <button onclick="submit()">Submit</button>

    </div>

  </div>
</div>

<!-- RESULT -->
<div id="result" style="display:none;">

  <h2>Hasil Ujian</h2>

  <div id="scoreNumber"></div>

</div>

<script src="script.js"></script>

</body>
</html>
