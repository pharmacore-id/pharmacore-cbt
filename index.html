<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>PHARMACORE CBT - UKMPPAI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN PAGE (2 KOLOM) -->
<div id="login">
  <div class="login-container">
    <div class="login-left">
      <img src="login-illustration.png" alt="Ilustrasi" class="login-image">
    </div>
    <div class="login-right">
      <div class="login-header-right">
        <button class="darkmode-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
      </div>
      <div class="badge">✨ TRY OUT UKMPPAI</div>
      <h1>PHARMACORE CBT</h1>
      <p class="subtitle">Simulasi dan Prediksi UKMPPAI untuk Calon Apoteker Indonesia</p>
      <div class="form-group"><label>Nama Peserta</label><input id="nama" placeholder="Masukkan nama lengkap"></div>
      <div class="form-group"><label>Token Ujian</label><input id="token" placeholder="Masukkan token ujian"></div>
      <button class="start-btn" onclick="login()">Mulai Ujian</button>
      <div class="exam-info">Soal • 60 Menit • CBT Online</div>
    </div>
  </div>
</div>

<!-- CBT APP (HALAMAN UJIAN) -->
<div id="app" style="display:none;">
  <div class="topbar">
    <div class="topbar-left">
      <img src="logo-pharmacore.png" alt="Logo" class="topbar-logo">
      <div class="brand">PHARMACORE CBT</div>
    </div>
    <div class="top-right">
      <button class="homepage-btn" onclick="goHome()">🏠 Homepage</button>
      <button class="darkmode-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
      <div class="progress-text"><span id="answeredCount">0</span>/<span id="totalCount">0</span> dijawab</div>
      <div class="timer" id="timer">60:00</div>
    </div>
  </div>
  <div class="wrapper">
    <div class="card">
      <div class="question-header"><div class="question-badge" id="questionLabel">Soal 1</div></div>
      <div class="progress"><div class="fill" id="progressFill"></div></div>
      <div id="q"></div>
      <div id="opt"></div>
      <div class="action-row">
        <button class="secondary-btn" onclick="prevQuestion()">← Sebelumnya</button>
        <button class="ragu-btn" id="raguBtn" onclick="toggleRagu()">🚩 Ragu</button>
        <button class="secondary-btn" onclick="nextQuestion()">Berikutnya →</button>
      </div>
    </div>
    <div class="side">
      <h3>📊 Navigasi Soal</h3>
      <div class="summary">
        <div class="summary-item"><span>✅ Terjawab</span><strong id="answeredSummary">0</strong></div>
        <div class="summary-item"><span>🚩 Ragu</span><strong id="raguSummary">0</strong></div>
        <div class="summary-item"><span>❌ Belum</span><strong id="unansweredSummary">0</strong></div>
      </div>
      <div id="nav" class="grid"></div>
      <div class="legend">
        <div><span class="dot done-dot"></span> Sudah Dijawab</div>
        <div><span class="dot ragu-dot"></span> Ditandai Ragu</div>
        <div><span class="dot empty-dot"></span> Belum Dijawab</div>
      </div>
      <button class="submit-btn" onclick="showReviewModal()">📋 Kumpulkan Jawaban</button>
      <hr>
      <button class="secondary-btn" onclick="toggleCalculator()">🧮 Kalkulator Scientific</button>
    </div>
  </div>
</div>

<!-- MODAL REVIEW SEBELUM SUBMIT -->
<div id="reviewModal" class="modal" style="display:none;">...</div>
<!-- MODAL REVIEW PEMBAHASAN -->
<div id="discussionModal" class="modal" style="display:none;">...</div>
<!-- HASIL UJIAN -->
<div id="result" style="display:none;">...</div>
<!-- KALKULATOR MODAL -->
<div id="calculatorModal" class="calculator-modal" style="display:none;">...</div>

<script src="script.js"></script>
</body>
</html>
