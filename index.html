// Save/Load
function saveState() {
  localStorage.setItem('pharmacore_answers', JSON.stringify(answers));
  localStorage.setItem('pharmacore_doubts', JSON.stringify(doubts));
  localStorage.setItem('pharmacore_current', currentQuestion);
  localStorage.setItem('pharmacore_timer', timerSeconds);
  localStorage.setItem('pharmacore_user', userName);
  localStorage.setItem('pharmacore_email', userEmail);
  localStorage.setItem('pharmacore_token', userToken);
  localStorage.setItem('pharmacore_login_time', userLoginTime);
  localStorage.setItem('pharmacore_start', startTime);
  localStorage.setItem('pharmacore_page', currentPage);
}

function loadState() {
  const saved = localStorage.getItem('pharmacore_answers');
  if (saved && localStorage.getItem('pharmacore_page') === 'exam') {
    answers = JSON.parse(saved);
    doubts = JSON.parse(localStorage.getItem('pharmacore_doubts') || '[]');
    currentQuestion = parseInt(localStorage.getItem('pharmacore_current') || '0');
    timerSeconds = parseInt(localStorage.getItem('pharmacore_timer') || '3600');
    userName = localStorage.getItem('pharmacore_user') || '';
    userEmail = localStorage.getItem('pharmacore_email') || '';
    userToken = localStorage.getItem('pharmacore_token') || '';
    userLoginTime = localStorage.getItem('pharmacore_login_time');
    startTime = localStorage.getItem('pharmacore_start');
    currentPage = 'exam';
    return true;
  }
  loadLeaderboard();
  return false;
}

function clearState() {
  localStorage.removeItem('pharmacore_answers');
  localStorage.removeItem('pharmacore_doubts');
  localStorage.removeItem('pharmacore_current');
  localStorage.removeItem('pharmacore_timer');
  localStorage.removeItem('pharmacore_user');
  localStorage.removeItem('pharmacore_email');
  localStorage.removeItem('pharmacore_start');
  localStorage.removeItem('pharmacore_page');
}

function loadLeaderboard() {
  const saved = localStorage.getItem('pharmacore_leaderboard');
  leaderboard = saved ? JSON.parse(saved) : [];
}

function saveLeaderboard() {
  localStorage.setItem('pharmacore_leaderboard', JSON.stringify(leaderboard));
}

// Timer
function startTimer() {
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds % 10 === 0) saveState();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      submitExam();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-display');
  if (!el) return;
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (timerSeconds < 300) el.classList.add('text-red-500');
}

function submitExam() {
  clearInterval(timerInterval);
  endTime = Date.now();
  currentPage = 'result';
  clearState();
  render();
}

// Render

function handleLogin(e) {
  e.preventDefault();
  const nameInput = document.getElementById('nama').value.trim();
  const emailInput = document.getElementById('email').value.trim();
  const tokenInput = document.getElementById('token').value.trim();
  const errorMsg = document.getElementById('error-message');
  const submitBtn = document.getElementById('submit-btn');

  if (!nameInput || !emailInput || !tokenInput) {
    showError('Semua field harus diisi', '');
    return;
  }

  const tokenList = validTokens.map(t => t.trim().toUpperCase());
  if (!tokenList.includes(tokenInput.toUpperCase())) {
    showError('Token akses tidak valid', 'Silakan hubungi Pharmacore untuk mendapatkan akses.');
    document.getElementById('token').value = '';
    return;
  }

  userName = nameInput;
  userEmail = emailInput;
  userToken = tokenInput.toUpperCase();
  userLoginTime = new Date();
  startTime = Date.now();
  currentPage = 'exam';
  saveState();
  render();
  startTimer();
}

function showError(text, subtext) {
  const errorMsg = document.getElementById('error-message');
  const errorText = document.getElementById('error-text');
  const errorSubtext = document.getElementById('error-subtext');
  errorText.textContent = text;
  errorSubtext.textContent = subtext;
  errorMsg.classList.remove('hidden');
  lucide.createIcons();
}

              else if (doubts[i]) cls = 'bg-amber-400 text-white';
              if (i === currentQuestion) cls += ' ring-2 ring-blue-500 ring-offset-1';
              return `<button onclick="goToQuestion(${i})" class="q-btn w-8 h-8 rounded-lg text-xs font-700 ${cls}">${i+1}</button>`;
            }).join('')}
          </div>

              <button onclick="hideConfirm()" class="flex-1 py-2.5 rounded-xl border border-slate-200 font-600 text-sm text-slate-600 hover:bg-slate-50 transition">Kembali</button>

  if (!timerInterval) startTimer();
}

function selectAnswer(i) { answers[currentQuestion] = i; saveState(); render(); }
function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; saveState(); render(); } }
function nextQuestion() { if (currentQuestion < 49) { currentQuestion++; saveState(); render(); } }
function goToQuestion(i) { currentQuestion = i; saveState(); render(); }
function toggleDoubt() { doubts[currentQuestion] = !doubts[currentQuestion]; saveState(); render(); }
function showConfirm() { document.getElementById('confirm-modal').classList.remove('hidden'); lucide.createIcons(); }
function hideConfirm() { document.getElementById('confirm-modal').classList.add('hidden'); }
