<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHARMACORE CBT</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login">

  <div class="login-card">

    <h1>PHARMACORE CBT</h1>

    <input id="nama" placeholder="Nama">
    <input id="token" placeholder="Token">

    <button onclick="login()">Mulai</button>

  </div>

</div>

<!-- ================= SAVE STATE ================= -->
  function saveState(){
  localStorage.setItem("cbt_state", JSON.stringify({
    currentQuestion,
    answers,
    ragu
  }));
}

<!-- ================= APP ================= -->
<div id="app" style="display:none;">

  <div class="topbar">

    <div>PHARMACORE CBT</div>

    <div>
      <span id="answeredCount">0</span>/<span id="totalCount">0</span>
      <span id="timer">60:00</span>
    </div>

  </div>

  <div class="wrapper">

    <!-- MAIN -->
    <div class="card">

      <div id="questionLabel">Soal 1</div>

      <div class="progress">
        <div id="progressFill"></div>
      </div>

      <div id="q"></div>
      <div id="opt"></div>

      <div class="action-row">

        <button onclick="prevQuestion()">Prev</button>
        <button onclick="toggleRagu()" class="ragu-btn">Ragu</button>
        <button onclick="nextQuestion()">Next</button>

      </div>

    </div>

    <!-- SIDEBAR -->
    <div class="side">

      <div>
        Terjawab: <span id="answeredSummary">0</span>
      </div>

      <div>
        Belum: <span id="unansweredSummary">0</span>
      </div>

      <div id="nav"></div>

      <button onclick="submit()">Submit</button>

      <hr>

      <button onclick="toggleDarkMode()">Dark Mode</button>

      <button onclick="calc('toggle')">Calculator</button>

    </div>

  </div>
</div>

<!-- ================= RESULT ================= -->
<div id="result" style="display:none;">
  <h1>Skor: <span id="scoreNumber"></span></h1>
</div>

<!-- ================= CALCULATOR ================= -->
<div id="calculatorModal" style="display:none;">

  <div>

    <input id="calcDisplay" readonly>

    <div>

      <button onclick="calc('7')">7</button>
      <button onclick="calc('8')">8</button>
      <button onclick="calc('9')">9</button>
      <button onclick="calc('/')">/</button>

      <button onclick="calc('4')">4</button>
      <button onclick="calc('5')">5</button>
      <button onclick="calc('6')">6</button>
      <button onclick="calc('*')">*</button>

      <button onclick="calc('1')">1</button>
      <button onclick="calc('2')">2</button>
      <button onclick="calc('3')">3</button>
      <button onclick="calc('-')">-</button>

      <button onclick="calc('0')">0</button>
      <button onclick="calc('.')">.</button>
      <button onclick="calc('equal')">=</button>
      <button onclick="calc('+')">+</button>

      <button onclick="calc('clear')">C</button>
      <button onclick="calc('back')">⌫</button>

    </div>

  </div>

</div>

</body>
</html>
