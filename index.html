<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT ULTRA PRO</title>

<style>
:root{
  --primary:#6d28d9;
  --bg:#f5f3ff;
  --card:#fff;
  --danger:#ef4444;
  --warning:#f59e0b;
  --success:#22c55e;
}

body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
}

/* LOGIN */
#login{
  max-width:360px;
  margin:120px auto;
  background:#fff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:12px 20px;
  background:#fff;
  position:sticky;
  top:0;
  border-bottom:1px solid #eee;
}

.brand{color:var(--primary);font-weight:700;}
.timer{color:var(--danger);font-weight:700;}

/* LAYOUT */
.wrapper{
  display:flex;
  gap:16px;
  padding:16px;
  max-width:1100px;
  margin:auto;
}

.card{
  flex:3;
  background:#fff;
  padding:20px;
  border-radius:14px;
}

.side{
  flex:1;
  background:#fff;
  padding:12px;
  border-radius:14px;
}

/* OPTIONS */
.opt{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:8px 0;
  cursor:pointer;
}

.opt.active{
  background:#ede9fe;
  border-color:var(--primary);
}

/* NAV */
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.grid button{
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#eee;
}

.done{background:var(--success)!important;color:#fff;}
.ragu{background:var(--warning)!important;color:#fff;}
.activeQ{outline:2px solid var(--primary);}

/* CONTROL */
.control{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.control button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
}

.submit{
  width:100%;
  margin-top:10px;
  padding:12px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:12px;
}
</style>
</head>

<body>

<div id="login">
  <h3>CBT LOGIN</h3>
  <input id="token" placeholder="Token">
  <input id="nama" placeholder="Nama">
  <button onclick="login()">Masuk</button>
</div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="brand">CBT ULTRA PRO</div>
    <div class="timer" id="timer">60:00</div>
  </div>

  <div class="wrapper">

    <div class="card">
      <div id="q"></div>
      <div id="opt"></div>

      <div class="control">
        <button onclick="prev()">Prev</button>
        <button onclick="flag()">Ragu</button>
        <button onclick="next()">Next</button>
      </div>

      <button class="submit" onclick="submit()">SUBMIT</button>

      <div id="progress" style="margin-top:10px;"></div>
    </div>

    <div class="side">
      <div id="nav" class="grid"></div>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
