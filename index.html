<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHARMACORE CBT</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f5f7;
}

/* LOGIN */
.login{
  max-width:360px;
  margin:120px auto;
  padding:20px;
  background:white;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#6d28d9;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* APP */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:12px 20px;
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
}

.wrapper{
  display:flex;
  gap:20px;
  padding:20px;
  max-width:1100px;
  margin:auto;
}

.card{
  flex:3;
  background:white;
  padding:20px;
  border-radius:12px;
}

.side{
  flex:1;
  background:white;
  padding:15px;
  border-radius:12px;
}

.opt{
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  margin:8px 0;
  cursor:pointer;
}

.opt:hover{
  border-color:#6d28d9;
}

.opt.active{
  background:#ede9fe;
  border-color:#6d28d9;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.grid button{
  padding:8px;
  border:none;
  border-radius:6px;
  background:#eee;
  cursor:pointer;
}

.grid button.done{
  background:#6d28d9;
  color:white;
}

.grid button.active{
  outline:2px solid black;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <h2>PHARMACORE CBT</h2>
  <input id="token" placeholder="Token">
  <input id="nama" placeholder="Nama">
  <button onclick="login()">Masuk</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="topbar">
    <div><b>PHARMACORE CBT</b></div>
    <div id="timer">60:00</div>
  </div>

  <div class="wrapper">

    <div class="card">
      <div id="q"></div>
      <div id="opt"></div>
    </div>

    <div class="side">
      <div id="nav" class="grid"></div>
    </div>

  </div>
</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
