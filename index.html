<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHARMACORE CBT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<!-- FIX: defer supaya DOM aman sebelum JS jalan -->
<script src="script.js" defer></script>

</head>

<body>

<!-- LOGIN PAGE -->
<div id="login">

  <div class="login-card">

    <div class="badge">
      ✨ TRY OUT UKMPPAI
    </div>

    <h1>PHARMACORE CBT</h1>

    <p class="subtitle">
      Simulasi dan Prediksi UKMPPAI untuk Calon Apoteker Indonesia
    </p>

    <div class="form-group">
      <label>Nama Peserta</label>
      <input id="nama" placeholder="Masukkan nama lengkap">
    </div>

    <div class="form-group">
      <label>Token Ujian</label>
      <input id="token" placeholder="Masukkan token ujian">
    </div>

    <button class="start-btn" onclick="login()">
      Mulai Ujian
    </button>

    <div class="exam-info">
      50 Soal • 60 Menit • CBT Online
    </div>

  </div>

</div>

<!-- CBT APP -->
<div id="app" style="display:none;">

  <div class="topbar">

    <div class="brand">
      PHARMACORE CBT
    </div>

    <div class="top-right">

      <div class="progress-text">
        <span id="answeredCount">0</span>/<span id="totalCount">0</span> dijawab
      </div>

      <div class="timer" id="timer">
        60:00
      </div>

    </div>

  </div>

  <!-- WRAPPER FIXED (STRUCTURE BALANCED) -->
  <div class="wrapper">

    <!-- MAIN CARD -->
    <div class="card">

      <div class="question-header">
        <div class="question-badge" id="questionLabel">
          Soal 1
        </div>
      </div>

      <div class="progress">
        <div class="fill" id="progressFill"></div>
      </div>

      <div id="q"></div>

      <div id="opt"></div>

      <div class="action-row">

        <button type="button" class="secondary-btn" onclick="prevQuestion()">
          ← Sebelumnya
        </button>

        <button type="button" class="ragu-btn" onclick="toggleRagu()">
          🚩 Ragu
        </button>

        <button type="button" class="secondary-btn" onclick="nextQuestion()">
          Berikutnya →
        </button>

      </div>

    </div>

    <!-- SIDEBAR -->
    <div class="side">

      <h3>Navigasi Soal</h3>

      <div class="summary">

        <div class="summary-item">
          <span>Terjawab</span>
          <strong id="answeredSummary">0</strong>
        </div>

        <div class="summary-item">
          <span>Belum</span>
          <strong id="unansweredSummary">0</strong>
        </div>

      </div>

      <div id="nav" class="grid"></div>

      <div class="legend">

        <div>
          <span class="dot done-dot"></span>
          Sudah Dijawab
        </div>

        <div>
          <span class="dot ragu-dot"></span>
          Ditandai Ragu
        </div>

        <div>
          <span class="dot empty-dot"></span>
          Belum Dijawab
        </div>

      </div>

      <button class="submit-btn" onclick="submit()">
        Kumpulkan Jawaban
      </button>

      <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">

      <button class="secondary-btn" onclick="toggleDarkMode()">
        🌙 Dark Mode
      </button>

      <button class="secondary-btn" style="margin-top:10px;" onclick="toggleCalculator()">
        🧮 Kalkulator
      </button>

    </div>

  </div>

</div>

<!-- RESULT -->
<div id="result">

  <div class="result-card">

    <h2>Hasil Ujian</h2>

    <div class="score-circle">
      <span id="scoreNumber">0</span>
    </div>

    <p id="skor"></p>

    <h3>Leaderboard</h3>

    <div id="board"></div>

  </div>

</div>

<!-- CALCULATOR -->
<div id="calculatorModal" class="calculator-modal">

  <div class="calculator-box">

    <div class="calculator-header">
      <span>🧮 Kalkulator</span>

      <button class="close-calc" onclick="toggleCalculator()">
        ✕
      </button>
    </div>

    <input type="text" id="calcDisplay" readonly>

    <div class="calc-grid">

      <button onclick="calc('7')">7</button>
      <button onclick="calc('8')">8</button>
      <button onclick="calc('9')">9</button>
      <button onclick="calc('/')">÷</button>

      <button onclick="calc('4')">4</button>
      <button onclick="calc('5')">5</button>
      <button onclick="calc('6')">6</button>
      <button onclick="calc('*')">×</button>

      <button onclick="calc('1')">1</button>
      <button onclick="calc('2')">2</button>
      <button onclick="calc('3')">3</button>
      <button onclick="calc('-')">−</button>

      <button onclick="calc('0')">0</button>
      <button onclick="calc('.')">.</button>
      <button onclick="calculateResult()">=</button>
      <button onclick="calc('+')">+</button>

      <button class="calc-clear" onclick="clearCalc()">
        C
      </button>

    </div>

  </div>

</div>

</body>
</html>
