<!DOCTYPE html>
<html>
<head>
  <title>PHARMACORE CBT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #1a0033;
      color: white;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #2a0055;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    input, button {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }

    .soal {
      margin-top: 20px;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .nav button {
      width: 40px;
      height: 40px;
    }

    .timer {
      font-size: 20px;
      color: #ffcc00;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>PHARMACORE CBT</h1>

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h3>Login Token</h3>
    <input id="token" placeholder="Masukkan token">
    <input id="nama" placeholder="Nama peserta">
    <button onclick="login()">Masuk</button>
  </div>

  <!-- CBT -->
  <div id="cbtBox" style="display:none;">

    <div class="timer" id="timer">60:00</div>

    <div class="card soal">
      <h3 id="pertanyaan"></h3>
      <div id="opsi"></div>
    </div>

    <div class="nav" id="nav"></div>

    <button onclick="submit()">Submit Ujian</button>
  </div>

</div>

<script>

let soal = [];
let index = 0;
let jawaban = {};
let token = "";
let nama = "";

// ================= LOGIN =================
function login() {
  token = document.getElementById("token").value;
  nama = document.getElementById("nama").value;

  fetch(`https://script.google.com/macros/s/AKfycbynWo-x1zFn7rkygSMtG3czSI8MTsbgZUOs8rjkPCy0TB0jAQW6onTYcLKmecXtbyEKRg/exec?action=validateToken&token=${token}`)
    .then(res => res.json())
    .then(data => {
      if (data.valid) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("cbtBox").style.display = "block";
        loadSoal();
        startTimer();
      } else {
        alert("Token tidak valid!");
      }
    });
}

// ================= LOAD SOAL =================
function loadSoal() {
  fetch("https://script.google.com/macros/s/AKfycbynWo-x1zFn7rkygSMtG3czSI8MTsbgZUOs8rjkPCy0TB0jAQW6onTYcLKmecXtbyEKRg/exec?action=getSoal")
    .then(res => res.json())
    .then(data => {
      soal = data.soal;
      renderSoal();
      renderNav();
    });
}

// ================= RENDER SOAL =================
function renderSoal() {
  let s = soal[index];

  document.getElementById("pertanyaan").innerHTML =
    (index + 1) + ". " + s.pertanyaan;

  document.getElementById("opsi").innerHTML = `
    <button onclick="pilih('A')">A. ${s.a}</button>
    <button onclick="pilih('B')">B. ${s.b}</button>
    <button onclick="pilih('C')">C. ${s.c}</button>
    <button onclick="pilih('D')">D. ${s.d}</button>
  `;
}

// ================= PILIH JAWABAN =================
function pilih(val) {
  jawaban[index] = val;
}

// ================= NAV =================
function renderNav() {
  let nav = "";
  for (let i = 0; i < soal.length; i++) {
    nav += `<button onclick="go(${i})">${i+1}</button>`;
  }
  document.getElementById("nav").innerHTML = nav;
}

function go(i) {
  index = i;
  renderSoal();
}

// ================= TIMER =================
function startTimer() {
  let time = 60 * 60;

  setInterval(() => {
    time--;

    let m = Math.floor(time / 60);
    let s = time % 60;

    document.getElementById("timer").innerHTML =
      `${m}:${s < 10 ? "0"+s : s}`;

    if (time <= 0) {
      submit();
    }
  }, 1000);
}

// ================= SUBMIT =================
function submit() {
  let skor = 0;

  soal.forEach((s, i) => {
    if (jawaban[i] == s.kunci) skor++;
  });

  fetch("https://script.google.com/macros/s/AKfycbynWo-x1zFn7rkygSMtG3czSI8MTsbgZUOs8rjkPCy0TB0jAQW6onTYcLKmecXtbyEKRg/exec", {
    method: "POST",
    body: JSON.stringify({
      action: "submit",
      nama: nama,
      token: token,
      skor: skor,
      jawaban: jawaban
    })
  })
  .then(res => res.json())
  .then(data => {
    alert("Ujian selesai! Skor kamu: " + skor);
    location.reload();
  });
}

</script>

</body>
</html>
